[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boundaries-of-retail-prediction-market-trading"
version = "0.1.0"
description = "Boundaries of Retail Quantitative Trading on Prediction Markets: A Multi-Mechanism Empirical Retrospective"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE-CODE"}
authors = [
  {name = "Stephen Wang", email = "lab@abel.ai"}
]
keywords = [
  "prediction-markets",
  "LLM-trading",
  "anchoring-bias",
  "retrospective",
  "Abelian-methodology"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Abel-ai-causality/boundaries-of-retail-prediction-market-trading"
Repository = "https://github.com/Abel-ai-causality/boundaries-of-retail-prediction-market-trading"
Issues = "https://github.com/Abel-ai-causality/boundaries-of-retail-prediction-market-trading/issues"

[tool.setuptools]
packages = []
